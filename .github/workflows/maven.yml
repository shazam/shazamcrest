# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CI build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.sh'
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-JDK_11:
    name: Java ${{ matrix.java }} build on JDK 11
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11 ]

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'zulu'
        cache: maven
    - name: Inspect environment
      run: |
        set | grep JAVA
    - name: Build with Maven
      run: mvn -B verify --file pom.xml -Djava.version.to.run="${{ matrix.java }}"
  build-JDK_17:
    name: Java ${{ matrix.java }} build on JDK 17
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11, 17 ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven
      - name: Inspect environment
        run: |
          set | grep JAVA
      - name: Build with Maven
        run: mvn -B verify --file pom.xml -Djava.version.to.run="${{ matrix.java }}"
  build-JDK_21:
    name: Java ${{ matrix.java }} build on JDK 21
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11, 17, 21 ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven
      - name: Inspect environment
        run: |
          set | grep JAVA
      - name: Build with Maven
        run: mvn -B verify --file pom.xml -Djava.version.to.run="${{ matrix.java }}"
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          cache: maven
      - name: Build with coverage
        run: mvn -B verify -Pcoverage --file pom.xml -Djava.version.to.run=27
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: approvalcrest-coverage-report/target/site/jacoco-aggregate/jacoco.xml
          fail_ci_if_error: false
  build-JDK_25:
    name: Java ${{ matrix.java }} build on JDK 25
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11, 17, 21, 25 ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven
      - name: Inspect environment
        run: |
          set | grep JAVA
      - name: Build with Maven
        run: mvn -B verify --file pom.xml -Djava.version.to.run="${{ matrix.java }}"
  build-JDK_27:
    name: Java ${{ matrix.java }} build on JDK 27
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11, 17, 21, 25, 27 ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'zulu'
          cache: maven
      - name: Inspect environment
        run: |
          set | grep JAVA
      - name: Build with Maven
        run: mvn -B verify --file pom.xml -Djava.version.to.run="${{ matrix.java }}"
  gradle:
    name: Gradle build on JDK ${{ matrix.java }}, Gradle 8.14 on JDK ${{ matrix.gradle8-java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Gradle 9.8 runs on JDK 17 to 27, and Gradle 8.14 on JDK 8 to 24, so each job pairs one of each.
        # As in the Maven jobs, the integration tests also run at each lower release level.
        include:
          - java: 17
            gradle8-java: 8
            lower-releases: 8 11
          - java: 21
            gradle8-java: 11
            lower-releases: 8 11 17
          - java: 25
            gradle8-java: 17
            lower-releases: 8 11 17 21
          - java: 27
            gradle8-java: 21
            lower-releases: 8 11 17 21 25

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.gradle8-java }} and ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          # The plugin tests run Gradle 8.14 on the first version. The last version is the default.
          java-version: |
            ${{ matrix.gradle8-java }}
            ${{ matrix.java }}
          distribution: 'zulu'
          cache: maven
      - name: Install the artifacts that the Gradle build tests
        run: mvn -B install -DskipTests --file pom.xml
      - name: Build with Gradle
        working-directory: approvalcrest-gradle
        run: ./gradlew check --configuration-cache --warning-mode=fail -Pjava.version.to.run=${{ matrix.java }} -Papprovalcrest.gradle8Java=${{ matrix.gradle8-java }}
      - name: Run the integration tests at the lower release levels
        working-directory: approvalcrest-gradle
        run: |
          for release in ${{ matrix.lower-releases }}; do
            ./gradlew integrationTest --configuration-cache --warning-mode=fail -Pjava.version.to.run=$release
          done
