# The plugin tests run Gradle 8.14 on a JDK 17, or on the JDK that -Papprovalcrest.gradle8Java gives. Gradle
# finds it through SDKMAN locally, and through the variables that actions/setup-java sets in CI. Nothing is
# downloaded. This build looks the JDK up, so the properties are here: an included build does not read the
# gradle.properties of the build that includes it.
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64
org.gradle.java.installations.auto-download=false
